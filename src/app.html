<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" href="%sveltekit.assets%/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
    <link rel="shortcut icon" href="%sveltekit.assets%/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png" />
    <link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
    <meta name="viewport" content="width=device-width" />
    <link rel="preconnect" href="https://use.typekit.net" crossorigin />
    <link rel="preconnect" href="https://p.typekit.net" />
    <link rel="stylesheet" href="https://use.typekit.net/nnm4nwt.css" />
    <!-- The no-JS half of the scroll reveal's first-paint hidden state (app.css,
         `[data-reveal]`). With scripting off this style applies and every
         revealed element paints normally; with scripting on the browser ignores
         the whole element, so the hidden state stands and animateIn owns it.
         Content can therefore never be stranded at opacity 0 by a browser that
         was never going to run the reveal — the same guarantee a curl of the
         SSR HTML gives a crawler. The same holds for the image blur-up.

         A style and not an inline `classList.add("js")` script, as in
         reddoor-starter: there a CSP drops unhashed inline scripts on some
         routes, and this site may adopt the same policy. A style needs no
         hash to keep working. -->
    <noscript>
      <style>
        [data-reveal] {
          opacity: 1 !important;
          transform: none !important;
        }
        /* The blur-up (app.css .progressive-img) is lifted only by Img.svelte. */
        .progressive-img {
          filter: none !important;
        }
      </style>
    </noscript>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover" style="background-color: #2d2322; overflow-x: hidden">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
